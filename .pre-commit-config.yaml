repos:
  - repo: local
    hooks:
      - id: web-tests
        name: web-tests
        entry: npm run test -w @scholar-career/web
        language: system
        pass_filenames: false
      - id: api-tests
        name: api-tests
        entry: npm run test -w @scholar-career/api
        language: system
        pass_filenames: false
